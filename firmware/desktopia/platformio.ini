; Desktopia motherboard – RP2040 (motor, height, current, state machine), master of the RS-485 link to the HMI board.
; Arduino core: Earle Philhower's arduino-pico, through Max Gerhardt's PlatformIO platform (as the HMI board).
;
; First flash: hold BOOT1, press RST1 (or plug the USB-C cable), release BOOT1 → the board shows up as a USB drive,
; then "pio run -t upload" (or copy .pio/build/desktopia/firmware.uf2 onto the drive). Later uploads reset the board
; into the bootloader by themselves. The USB-C port powers the logic (not the motor): no 24 V needed to flash.

[platformio]
default_envs = desktopia

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico                         ; RP2040 + QSPI flash (W25Q128JV, 16 MB, 2 MB used), 12 MHz crystal
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m     ; the presets use the EEPROM emulation (one 4 kB flash sector)
monitor_speed = 115200
build_src_flags = -Wall -Wextra
lib_deps = https://github.com/stm32duino/VL53L1X.git#2.0.1
lib_extra_dirs = ../shared                    ; hmi_link: protocol shared with the HMI board firmware
upload_protocol = picotool

[env:desktopia]

[env:desktopia_debug]
build_flags = -DDEBUG_SERIAL=1

; Bench test of the motor without the desk mechanism: height sensor ignored, no end stops (see README)
[env:desktopia_motor_test]
build_flags = -DTOF_BYPASS=1 -DMOTOR_PWM_MAX_PERCENT=25
