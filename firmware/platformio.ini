; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = desktopia

[env]
platform = atmelavr
framework = arduino
board = micro
board_build.f_cpu = 16000000L
monitor_speed = 115200
build_src_flags = -Wall -Wextra
lib_deps = https://github.com/stm32duino/VL53L1X.git#2.0.1
lib_extra_dirs = ../shared                    ; hmi_link: protocol shared with the HMI board firmware

[env:desktopia]
upload_protocol = avr109

[env:desktopia_isp]
upload_protocol = usbasp
upload_flags = -Pusb

[env:desktopia_debug]
extends = env:desktopia
build_flags = -DDEBUG_SERIAL=1

; Bench test of the motor without the desk mechanism: height sensor ignored, no end stops (see README)
[env:desktopia_motor_test]
extends = env:desktopia
build_flags = -DTOF_BYPASS=1 -DMOTOR_PWM_MAX_PERCENT=25
