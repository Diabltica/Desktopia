; Desktopia HMI board – RP2040 (screen + buttons), linked to the motherboard by RS-485 over an RJ11 cord.
; Arduino core: Earle Philhower's arduino-pico, through Max Gerhardt's PlatformIO platform.
;
; First flash: hold BOOT (SW6), plug the USB-C cable, release BOOT → the board shows up as a USB drive,
; then "pio run -t upload" (or copy .pio/build/hmi/firmware.uf2 onto the drive).

[platformio]
default_envs = hmi

[env:hmi]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico                         ; RP2040 + 2 MB QSPI flash (W25Q16JV), 12 MHz crystal: same as the Pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
lib_extra_dirs = ../shared           ; hmi_link: protocol shared with the motherboard firmware
build_src_flags = -Wall -Wextra
upload_protocol = picotool
